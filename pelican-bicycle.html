<!DOCTYPE html>
<!--
  A pelican riding a bicycle.

  Made of SVG and HTML only: no CSS, no JavaScript, no images, no fonts, nothing external.
  Every bit of motion is a declarative SVG animation (<animate> / <animateTransform>).

  Layout: the drawing lives in a 700 x 690 viewBox that is scaled to fit the window. The sky,
  sea and pier are drawn far beyond that box, so whatever shape the window is, it is filled
  edge to edge. The page margin is removed with plain HTML attributes on <body>.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2D8CE0">
<title>A pelican riding a bicycle</title>
</head>
<body marginwidth="0" marginheight="0" bgcolor="#1E9BB9">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 30 700 690" width="100%" height="100vh" display="block"
     role="img" aria-label="A white pelican riding a red bicycle along a wooden pier by the sea">

      <stop offset=".6" stop-color="#6FBDF3"/>
      <stop offset="1" stop-color="#CDEBFA"/>

    <linearGradient id="sea" gradientUnits="userSpaceOnUse" x1="0" y1="545" x2="0" y2="1100">
      <stop offset="0" stop-color="#4CC3D2"/>
      <stop offset=".28" stop-color="#1F9DBB"/>
      <stop offset="1" stop-color="#136C94"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FFF9DB" stop-opacity=".95"/>
      <stop offset=".38" stop-color="#fff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pouch" gradientUnits="userSpaceOnUse" x1="0" y1="118" x2="0" y2="196">
      <stop offset="0" stop-color="#FFD657"/>
      <stop offset="1" stop-color="#F8A62A"/>
    </linearGradient>

    <g id="cloud">

      <circle cx="100" cy="30" r="22"/><circle cx="124" cy="40" r="14"/>
      <rect x="12" y="34" width="126" height="20" rx="10"/>
    </g>
    <!-- one 2400-wide strip of clouds; repeated side by side so it can scroll forever -->

      <use href="#cloud" transform="translate(96 418) scale(.62)" fill="#EAF6FE"/>
      <use href="#cloud" transform="translate(1010 150) scale(1.25)"/>
      <use href="#cloud" transform="translate(-170 210) scale(-1.1 1.1)"/>

      <use href="#cloud" transform="translate(-330 -130)"/>
