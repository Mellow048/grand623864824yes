# Declarative official media fetch plan for `vicecut media-fetch` & 1-click GitHub Actions!
# Downloads official Rockstar Games & PlayStation GTA 6 trailers, splits them into clean
# 1.6-3.4s clips (auto cropdetect + bright/dark luminance scoring + Start|Mid|End QC sheets),
# captures verified proof headlines (with automatic clean white-card fallback if paywalled),
# and preserves our 4 pre-rendered white-background motion prop PNGs in media/photos/.
project: gta6-before-you-play

videos:
  - id: src_launch_trailer
    title: "Grand Theft Auto VI — Official Launch Trailer"
    channel_or_outlet: "Rockstar Games"
    url: "https://www.youtube.com/watch?v=8u_lV1LQr1Q"
    page_url: "https://www.rockstargames.com/VI"
    date: "2026-10-15"
    license: "official-trailer-commentary"
    is_official: true
    scene_threshold: 0.24
    min_clip_s: 1.6
    max_clip_s: 3.3
    drop_first_s: 2.2
    drop_last_s: 5.5
    tags: [vice_city, leonida, jason, lucia, launch_trailer, ps5]

