<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1.0">
  <title>ViceCut 1920x1080 Transparent Overlay Stage</title>
  <style>
    :root {
      --vc-panel-bg: #1E1322;
      --vc-border: #F7D3EA;
      --vc-glow-rgb: 255, 120, 205;
      --vc-grad-start: #FF93DC;
      --vc-grad-end: #FFB27C;
      --vc-pill-pink: #FB96E6;
      --vc-pill-cream: #FFF1DE;
      --vc-pill-peach: #FFBA90;
      --vc-pill-text: #1A1020;
      --vc-font: 'Montserrat', 'Arial Black', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: var(--vc-font);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    .grad-text {
      background: linear-gradient(90deg, var(--vc-grad-start) 0%, var(--vc-grad-end) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 6px 20px rgba(10, 4, 15, 0.88));
    }

    .glass-panel {
      background: color-mix(in srgb, var(--vc-panel-bg) 92%, transparent);
      border: 2.5px solid var(--vc-border);
      border-radius: 26px;
      box-shadow:
        0 26px 64px rgba(0, 0, 0, 0.58),
        0 0 40px rgba(var(--vc-glow-rgb), 0.44),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }

    /* ---------------- Source & Confidence Pills (top-left stack) ---------------- */
    .source-pill {
      position: absolute;
      left: 66px;
      padding: 10px 26px;
      border-radius: 999px;
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--vc-pill-text);
      line-height: 1.1;
      box-shadow:
        0 10px 26px rgba(0, 0, 0, 0.45),
        0 0 22px rgba(var(--vc-glow-rgb), 0.34);
      white-space: nowrap;
      will-change: opacity, transform;
    }
    .pill-pink  { background: var(--vc-pill-pink); }
    .pill-cream { background: var(--vc-pill-cream); }
    .pill-peach { background: var(--vc-pill-peach); }

    /* ---------------- Photo Card (up to 44% W, portrait 30% W x 74% H, +/-1.4 deg) ---------------- */
    .card-photo-wrap {
      position: absolute;
      left: 50%;
      top: 48%;
      transform-origin: center center;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-photo-wrap img,
    .card-photo-wrap .photo-placeholder {
      display: block;
      border-radius: 16px;
      object-fit: cover;
      max-width: 816px;   /* ~44% of 1920 minus padding */
      max-height: 700px;
    }
    .card-photo-wrap.portrait img,
    .card-photo-wrap.portrait .photo-placeholder {
      max-width: 548px;   /* ~30% of 1920 minus padding */
      max-height: 770px;  /* ~74% of 1080 minus padding */
    }
    .card-photo-wrap .photo-placeholder {
      width: 780px;
      height: 440px;
      background: linear-gradient(135deg, rgba(var(--vc-glow-rgb), 0.25), rgba(30, 19, 34, 0.95));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--vc-border);
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .card-corner-pill-bl {
      position: absolute;
      left: -18px;
      bottom: -20px;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--vc-pill-text);
      background: var(--vc-pill-cream);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5);
    }

    /* ---------------- Headline Card (50% W = 960px, +/-1.1 deg, outlet pill top-left) ---------------- */
    .card-headline-wrap {
      position: absolute;
      left: 50%;
      top: 47%;
      width: 960px;
      padding: 18px;
    }
    .card-headline-wrap img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
    }
    .headline-white-fallback {
      background: #FFFFFF;
      color: #121218;
      border-radius: 14px;
      padding: 44px 48px 36px 48px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
    }
    .headline-white-fallback .hl-title {
      font-size: 46px;
      font-weight: 900;
      line-height: 1.15;
      color: #111118;
      letter-spacing: -0.01em;
    }
    .headline-white-fallback .hl-meta {
      margin-top: 22px;
      font-size: 22px;
      font-weight: 700;
      color: #5A5A6B;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .card-corner-pill-tl {
      position: absolute;
      left: -18px;
      top: -22px;
      padding: 10px 26px;
      border-radius: 999px;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--vc-pill-text);
      background: var(--vc-pill-pink);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5);
    }

    /* ---------------- Character Card (474x896 at x=64.5% or x=10.5%, sharp BG) ---------------- */
    .card-character-wrap {
      position: absolute;
      top: 92px;
      width: 474px;
      height: 896px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .card-character-wrap .char-photo {
      width: 100%;
      height: 572px;
      border-radius: 16px;
      object-fit: cover;
      background: linear-gradient(160deg, rgba(var(--vc-glow-rgb), 0.22), rgba(20, 12, 26, 0.9));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--vc-border);
      font-size: 28px;
      font-weight: 900;
      text-transform: uppercase;
      overflow: hidden;
    }
    .card-character-wrap .char-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-character-wrap .char-name {
      margin-top: 28px;
      font-size: 50px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      text-align: left;
    }
    .card-character-wrap .char-lines {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-character-wrap .char-line {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.28;
      color: #FFF4F9;
    }

    /* ---------------- Quote Card (x=19%..81%, top y=54%, typed word-by-word) ---------------- */
    .card-quote-wrap {
      position: absolute;
      left: 19%;
      width: 62%;
      top: 54%;
      padding: 36px 50px 44px 58px;
    }
    .quote-open-mark {
      position: absolute;
      left: 24px;
      top: -46px;
      font-size: 138px;
      font-weight: 900;
      line-height: 1;
      color: var(--vc-pill-pink);
      text-shadow: 0 8px 28px rgba(var(--vc-glow-rgb), 0.55);
      user-select: none;
    }
    .quote-body {
      font-size: 40px;
      font-weight: 700;
      line-height: 1.32;
      color: #FFFFFF;
      letter-spacing: 0.01em;
    }
    .quote-word {
      display: inline;
      transition: none;
    }
    .quote-attr-pill {
      display: inline-block;
      margin-top: 24px;
      padding: 9px 24px;
      border-radius: 999px;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--vc-pill-text);
      background: var(--vc-pill-pink);
    }

    /* ---------------- Number Card (250px gradient figure shrunk <=80% W + subline) ---------------- */
    .card-number-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .number-figure {
      font-size: 250px;
      font-weight: 900;
      line-height: 0.96;
      text-transform: uppercase;
      white-space: nowrap;
      letter-spacing: -0.02em;
    }
    .number-subline {
      margin-top: 22px;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #FFF4F9;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.85);
    }

    /* ---------------- Chapter Word (214px gradient, 1-3 words shrunk <=72% W) ---------------- */
    .card-chapter-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 72%;
      text-align: center;
    }
    .chapter-word {
      font-size: 214px;
      font-weight: 900;
      line-height: 1.02;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      white-space: nowrap;
      display: inline-block;
    }

    /* ---------------- Compact Floating White-Background Motion Prop PiP (Zero People!) ---------------- */
    /* Intentionally small (~9% of frame, top-right PiP) so crisp moving gameplay ALWAYS dominates behind it! */
    .card-prop-wrap {
      position: absolute;
      right: 72px;
      top: 118px;
      width: 520px;
      height: 370px;
      background: #FFFFFF;
      border: 3px solid var(--vc-border);
      border-radius: 22px;
      box-shadow:
        0 0 28px rgba(var(--vc-glow-rgb), 0.40),
        0 18px 46px rgba(0, 0, 0, 0.58);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    .prop-stage {
      position: relative;
      width: 100%;
      flex: 1;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .prop-shadow {
      position: absolute;
      bottom: 18px;
      width: 210px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(30, 19, 34, 0.24) 0%, rgba(30, 19, 34, 0) 72%);
      pointer-events: none;
    }
    .prop-img {
      max-width: 82%;
      max-height: 235px;
      object-fit: contain;
      will-change: transform;
      user-select: none;
    }
    .prop-footer {
      width: 100%;
      background: #1E1322;
      border-top: 2px solid var(--vc-border);
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 3px;
    }
    .prop-label {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.08;
    }
    .prop-subline {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--vc-pill-cream);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* ---------------- Key-Word Captions (y=80%, width 60%, fixed non-shifting layout) ---------------- */
    .caption-wrap {
      position: absolute;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      text-align: center;
      line-height: 1.06;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .caption-word {
      display: inline-block;
      margin: 0 0.14em;
    }

    .mockup-tag {
      position: absolute;
      right: 16px;
      top: 16px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--vc-pill-peach);
      color: var(--vc-pill-text);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>

    (function initStage() {
      const stage = document.getElementById('stage');

      function applyTheme(themeVars) {
        if (!themeVars) return;
        const root = document.documentElement.style;
        Object.entries(themeVars).forEach(([k, v]) => root.setProperty(k, v));
      }

      function clamp01(v) {
        return Math.max(0, Math.min(1, v));
      }

      function cardEnvelope(t, start, end, fade) {
        if (t < start || t >= end) return 0;
        const fin = fade > 0 ? clamp01((t - start) / fade) : 1;
        const fout = fade > 0 ? clamp01((end - t) / fade) : 1;
        return Math.min(fin, fout);
      }

      function fitWidthText(el, maxWidthPx) {
        let size = parseFloat(window.getComputedStyle(el).fontSize);
        while (el.scrollWidth > maxWidthPx && size > 40) {
          size -= 6;
          el.style.fontSize = size + 'px';
        }
      }

      function esc(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')

            : `<div class="photo-placeholder">${esc(p.label || p.asset_id)}</div>`;
          const mockupHtml = p.is_mockup ? `<div class="mockup-tag">MOCK-UP</div>` : '';

          const mockupHtml = p.is_mockup ? `<div class="mockup-tag">MOCK-UP</div>` : '';

            <div class="char-lines">
              ${p.line1 ? `<div class="char-line">${esc(p.line1)}</div>` : ''}
              ${p.line2 ? `<div class="char-line">${esc(p.line2)}</div>` : ''}
            </div>`;
          stage.appendChild(el);
        } else if (card.card_type === 'quote') {
          el.className = 'glass-panel card-quote-wrap';
          const typed = p.typed_words || [];
          const wordsHtml = typed.map(w => {
            const vis = t >= w.reveal_s ? 1 : 0;
            return `<span class="quote-word" style="opacity:${vis}">${esc(w.text)} </span>`;
          }).join('');
          el.innerHTML = `
            <div class="quote-open-mark">&ldquo;</div>
            <div class="quote-body">${wordsHtml || esc(p.quote_text)}</div>
            <div class="quote-attr-pill">${esc(p.attribution)}</div>`;
          stage.appendChild(el);
        } else if (card.card_type === 'number') {
          el.className = 'card-number-wrap';
          el.innerHTML = `
            <div class="number-figure grad-text">${esc(p.figure)}</div>
            ${p.subline ? `<div class="number-subline">${esc(p.subline)}</div>` : ''}`;
          stage.appendChild(el);
          fitWidthText(el.querySelector('.number-figure'), 1920 * 0.80);
        } else if (card.card_type === 'chapter') {
          el.className = 'card-chapter-wrap';
          el.innerHTML = `<div class="chapter-word grad-text">${esc(p.text)}</div>`;
          stage.appendChild(el);
          fitWidthText(el.querySelector('.chapter-word'), 1920 * 0.72);
        } else if (card.card_type === 'prop') {
          // Animated white-background studio prop (deterministic 30fps motion, zero people!)
          const dt = Math.max(0, t - card.start_s);
          const dur = Math.max(0.4, card.end_s - card.start_s);
          const prog = clamp01(dt / dur);
          const inP = clamp01(dt / 0.42);
          // Smooth overshoot easeOutBack curve
          const c1 = 1.70158, c3 = c1 + 1;
          const easeBack = 1 + c3 * Math.pow(inP - 1, 3) + c1 * Math.pow(inP - 1, 2);
          const anim = p.animation || 'float_zoom';

          let cardTx = 0, cardTy = 0, cardScale = 1, cardRot = 0;
          let objTx = 0, objTy = 0, objScale = 1, objRot = 0;
          if (anim === 'slide_swing') {
            cardTx = (1 - easeBack) * 110;
            cardRot = -1.0 + 0.5 * Math.sin(dt * 1.6);
            objTy = -9 * Math.sin(dt * 2.8);
            objRot = 3.2 * Math.sin(dt * 2.4);
            objScale = 0.94 + 0.08 * prog;
          } else if (anim === 'bounce_pop') {
            cardScale = 0.84 + 0.16 * easeBack;
            cardRot = 1.0 * Math.cos(dt * 1.4);
            objTx = 8 * Math.sin(dt * 2.4);
            objTy = -11 * Math.abs(Math.sin(dt * 2.6));
            objScale = 0.96 + 0.04 * Math.sin(dt * 4.2) + 0.05 * prog;
            objRot = -2.2 * Math.sin(dt * 2.2);
          } else {
            // float_zoom (default): smooth spring pop + levitation + gentle zoom & tilt
            cardScale = 0.86 + 0.14 * easeBack;
            cardRot = -0.8 + 0.4 * Math.sin(dt * 1.5);
            objTy = -11 * Math.sin(dt * 3.0);
            objRot = 2.4 * Math.sin(dt * 2.0);
            objScale = 0.95 + 0.09 * prog;
          }

          // Floor shadow responds dynamically to object height!
          const liftNorm = clamp01((-objTy) / 14);
          const shadScale = (1 - 0.22 * liftNorm).toFixed(3);
          const shadAlpha = (0.9 - 0.35 * liftNorm).toFixed(3);

          el.className = 'card-prop-wrap';
          el.style.transform = `translate(${cardTx.toFixed(1)}px, ${cardTy.toFixed(1)}px) scale(${cardScale.toFixed(4)}) rotate(${cardRot.toFixed(2)}deg)`;
          const imgHtml = p.image_path
            ? `<img class="prop-img" src="${esc(p.image_path)}" alt="${esc(p.label)}" style="transform: translate(${objTx.toFixed(1)}px, ${objTy.toFixed(1)}px) scale(${objScale.toFixed(4)}) rotate(${objRot.toFixed(2)}deg);">`
            : `<div class="photo-placeholder" style="color:#1E1322;background:#F6EEF8;">${esc(p.label || p.asset_id)}</div>`;
          el.innerHTML = `
            <div class="prop-stage">
              <div class="prop-shadow" style="transform: scale(${shadScale}); opacity:${shadAlpha};"></div>
              ${imgHtml}
            </div>
            <div class="prop-footer">
              <div class="prop-label grad-text">${esc(p.label)}</div>
              ${p.subline ? `<div class="prop-subline">${esc(p.subline)}</div>` : ''}
            </div>`;
          stage.appendChild(el);
        }
      }

      function renderCaption(cap, t) {
        if (t < cap.start_s || t >= cap.end_s) return;
        const el = document.createElement('div');
        el.className = 'caption-wrap';
        el.style.top = (cap.y_pct || 80) + '%';
        el.style.fontSize = (cap.font_size_px || 92) + 'px';

        // Pre-laid-out inline spans fade in over 0.20s at exact spoken moment — zero layout shift!
        el.innerHTML = (cap.words || []).map(w => {
          const wAlpha = clamp01((t - w.reveal_s) / 0.20);
          return `<span class="caption-word grad-text" style="opacity:${wAlpha.toFixed(4)}">${esc(w.text)}</span>`;
        }).join('');
        stage.appendChild(el);
      }

      function renderPill(pill, t) {
        const alpha = cardEnvelope(t, pill.start_s, pill.end_s, 0.22);
        if (alpha <= 0.001) return;
        const el = document.createElement('div');
        el.className = `source-pill pill-${pill.color_variant || 'pink'}`;
        el.style.top = (52 + (pill.slot_index || 0) * 76) + 'px';
        el.style.transform = `rotate(${pill.tilt_deg || -2}deg)`;
        el.style.opacity = alpha.toFixed(4);
        el.textContent = pill.label;
        stage.appendChild(el);
      }

      window.renderFrame = function renderFrame(frameIndex) {
        const tl = window.__TIMELINE__;
        if (!tl) return;
        applyTheme(tl.theme);
        const t = frameIndex / (tl.fps || 30);
        stage.innerHTML = '';

        (tl.cards || []).forEach(c => renderCard(c, t));
        (tl.captions || []).forEach(c => renderCaption(c, t));
        (tl.pills || []).forEach(p => renderPill(p, t));
      };

      if (window.__TIMELINE__) {
        applyTheme(window.__TIMELINE__.theme);
        window.renderFrame(0);
      }
    })();
  </script>
</body>
</html>
