<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelican Riding a Bicycle — Pure SVG &amp; HTML</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #1E3A52 0%, #152839 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    svg#scene {
      width: min(100vw, 150vh);
      height: auto;
      max-height: 100vh;
      display: block;
      border-radius: 12px;
      box-shadow: 0 24px 70px rgba(7, 18, 30, 0.55);
    }

  <svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800"
