name: ViceCut CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Pytest & Sample Pipeline Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package & dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run full pytest suite
        run: pytest -v

      - name: Verify flagship GTA 6 sample passes research & 28-rule script lint
        run: |
          vicecut audit-research examples/gta6-sample
          vicecut check examples/gta6-sample
          vicecut media-budget examples/gta6-sample
