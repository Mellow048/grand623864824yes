# Declarative official media fetch plan for `vicecut media-fetch` & GitHub Actions!
# Running `vicecut media-fetch examples/gta6-sample` (or triggering the GitHub Actions
# "ViceCut Preview Render" workflow with run_media_fetch=true) downloads these official
# assets, splits trailers into clean 1.7-3.5s scenes with cropdetect & bright/dark scoring,
# builds Start|Mid|End visual QC sheets, captures headlines (with automatic white-card
# fallback if paywalled or <1/3 frame wide), and updates media/manifest.yaml automatically.
project: gta6-before-you-buy-sample

videos:
  - id: src_trailer1
    title: "Grand Theft Auto VI Trailer 1"
    channel_or_outlet: "Rockstar Games"
    url: "https://www.youtube.com/watch?v=QdBZY2fkU-0"
    page_url: "https://www.rockstargames.com/VI"
    date: "2023-12-04"
    license: "official-trailer-commentary"
    is_official: true
    scene_threshold: 0.28
    min_clip_s: 1.6
    max_clip_s: 3.4
    drop_first_s: 2.5
    drop_last_s: 5.0
    tags: [vice_city, leonida, trailer1]

  - id: src_trailer2
